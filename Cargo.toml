[workspace]
resolver = "3"
members = ["crates/aegis-core", "crates/aegis-devices", "crates/aegis-kvm", "crates/aegis-probe", "crates/aegis-cli"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.97"
license = "Apache-2.0"
repository = "https://github.com/obstinix/Aegis"
publish = false

# Every external crate is listed here once, with a pinned minor version.
# Licenses are enforced by deny.toml (ADR-0011).
[workspace.dependencies]
kvm-bindings = "0.14.2"
kvm-ioctls = "0.25.1"
vm-memory = { version = "0.18.0", features = ["backend-mmap"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
arithmetic_side_effects = "warn"
